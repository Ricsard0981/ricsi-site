<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videos — Ricsi</title>
<meta name="description" content="Ricsi's latest YouTube uploads and stream.">
<meta name="theme-color" content="#E9EEF3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%237a5133'/%3E%3Crect width='8' height='3' fill='%236DBE2E'/%3E%3Crect y='3' width='2' height='1' fill='%236DBE2E'/%3E%3Crect x='5' y='3' width='1' height='1' fill='%236DBE2E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-page="content">
<main>
  <header class="wrap hero" data-clip="Videos" data-flavor="blueberry">
    <h1 class="h-page in" style="--i:0">Videos</h1>
    <p class="lede in" style="--i:1;margin-top:24px">Public uploads from the channel, refreshed automatically every few hours.</p>
    <div class="btn-row in" style="--i:2"><a class="btn" href="#" data-social="youtube">Open the channel</a></div>
  </header>
  <section class="section" data-clip="Uploads" data-flavor="tangerine">
    <div class="wrap"><div class="thumbs" id="video-grid"></div></div>
  </section>
  <section class="section" data-clip="Stream" data-flavor="strawberry">
    <div class="wrap">
      <h2 class="h-sec rv">Latest stream</h2>
      <div class="thumbs" id="stream-grid"></div>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
