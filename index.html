<meta name="description" content="Ricsi: video editor, developer and music producer from Hungary. Latest uploads, channels and projects.">
<meta property="og:title" content="Ricsi — videos, code and music">

<meta name="theme-color" content="#E9EEF3">

<body data-page="home">
<main>
  <header class="wrap hero" data-clip="Intro" data-flavor="blueberry">
    <p class="hero-roles in" style="--i:0"><b id="role">Video Editor</b> from Hungary</p>
    <h1 class="hero-name in" style="--i:1">Ricsi</h1>
    <div class="hero-grid">
      <div>
        <p class="lede in" style="--i:2">I make Minecraft videos, write code and produce music as rix.off. This is where all of it lives.</p>
        <div class="btn-row in" style="--i:3">
          <a class="btn" href="#" data-social="youtube">Watch on YouTube</a>
          <a class="btn ghost" href="about.html">Read about me</a>
        </div>
      </div>
      <figure class="player in" style="--i:2;margin:0" aria-label="Latest upload">
        <div class="screen" id="screen"></div>
        <div class="transport">
          <button class="play" id="play" aria-label="Play latest video"><svg viewBox="0 0 10 12"><path d="M0 0l10 6-10 6z"/></svg></button>
          <div><div class="np-label">Latest upload</div><div class="np-title" id="np-title">Loading…</div></div>
        </div>
      </figure>
    </div>
  </header>

  <section class="section" data-clip="Channels" data-flavor="strawberry">
    <div class="wrap">
      <h2 class="h-sec rv">Where to find me</h2>
      <div class="rows" id="rows"></div>
    </div>
  </section>

  <section class="section" data-clip="Uploads" data-flavor="tangerine">
    <div class="wrap">
      <div class="sec-head rv">
        <h2 class="h-sec">Recent uploads</h2>
        <a class="btn ghost" href="content.html">All videos and streams</a>
      </div>
      <div class="thumbs" id="recent"></div>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
